<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>GoldHEN Activation</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 150px;
            margin: 0;
        }
        h1 {
            color: #ffffff;
            font-size: 28px;
        }
        .btn {
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        #status {
            font-size: 26px;
            margin-top: 40px;
            font-weight: bold;
        }
        /* Glitch Effect */
        .glitch {
            animation: glitchAnim 0.15s infinite;
            color: #ff3b30;
        }
        @keyframes glitchAnim {
            0% { transform: translate(0); opacity: 1; }
            20% { transform: translate(-8px, 6px); opacity: 0.7; }
            40% { transform: translate(-4px, -6px); opacity: 0.4; }
            60% { transform: translate(6px, 4px); opacity: 0.9; }
            80% { transform: translate(4px, -4px); opacity: 0.6; }
            100% { transform: translate(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>GoldHEN Activation Page</h1>
    <p>Click the button below to start</p>
    
    <button id="activateBtn" class="btn" onclick="runExploit()">Active GoldHEN</button>
    
    <div id="status"></div>

    <script>
        function runExploit() {
            const btn = document.getElementById('activateBtn');
            const status = document.getElementById('status');
            
            // Hide button and start glitch effect
            btn.style.display = 'none';
            status.innerText = "Initializing exploit...";
            status.className = "glitch";

            // Timeout trigger in case the system hangs (after 15 seconds)
            let timeoutTrigger = setTimeout(function() {
                status.className = "";
                status.style.color = "#ff9500";
                status.innerText = "Please restart your PlayStation";
                
                // Show button again to retry
                setTimeout(() => {
                    btn.style.display = 'inline-block';
                    btn.innerText = "Try Again";
                }, 1500);
            }, 15000); // 15 seconds timeout

            // Simulate successful operation and show Done after 3 seconds
            setTimeout(function() {
                clearTimeout(timeoutTrigger); // Clear timeout since it succeeded
                status.className = "";
                status.style.color = "#34c759";
                status.innerText = "Done";
                
                // Additional confirmation message after Done
                setTimeout(function() {
                    status.innerHTML += "<br><span style='font-size: 18px; color: #fff;'>GoldHEN activated successfully!</span>";
                }, 800);

            }, 3000);
        }
    </script>

</body>
</html>
