<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHTA PS4 Exploit Host - GoldHEN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #d4af37; /* Gold Color */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #aaaaaa;
            margin-bottom: 35px;
        }

        /* زر التفعيل المصمم خصيصاً ليتوافق مع أداة تحكم البلايستيشن (PS4 Controller Focus) */
        .btn-activate {
            background: linear-gradient(135deg, #222222, #111111);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 20px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            outline: none;
            display: inline-block;
        }

        .btn-activate:hover, .btn-activate:focus {
            background: #d4af37;
            color: #000000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
            transform: scale(1.06);
        }

        /* شاشة التحميل والـ Buffering */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 75px;
            height: 75px;
            border: 6px solid #222;
            border-top: 6px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.4rem;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .progress-bar {
            width: 320px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #d4af37;
            transition: width 0.3s ease;
        }

        /* شاشة الخطأ والتنبيه بإعادة التشغيل */
        #error-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            text-align: center;
            padding: 20px;
        }

        .error-box {
            background: #111;
            border: 2px solid #ff3333;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
            max-width: 520px;
        }

        .error-box h2 {
            color: #ff3333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .error-box p {
            color: #ffffff;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-retry {
            background: #ff3333;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-retry:hover, .btn-retry:focus {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* إطار تشغيل الثغرة المخفي (Exploit Frame) */
        #exploit-frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 200;
            background: #000;
        }

        /* مؤشر حالة الكاش والاتصال الداخلي */
        .cache-status {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1>SHTA GoldHEN Exploit Host</h1>
        <p class="subtitle">Secure Environment & Payload Injector</p>
        
        <!-- زر التفعيل -->
        <button class="btn-activate" id="activateBtn" onclick="startExploitProcess()">ACTIVATE GOLDHEN</button>
    </div>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text" id="statusText">INITIALIZING EXPLOIT...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- شاشة الخطأ وإعادة التشغيل -->
    <div id="error-screen">
        <div class="error-box">
            <h2>EXPLOIT FAILED / MEMORY ERROR</h2>
            <p>The exploit took too long to respond or failed to inject. Please restart your PlayStation 4 console and try again.</p>
            <button class="btn-retry" onclick="location.reload()">RETRY AGAIN</button>
        </div>
    </div>

    <!-- إطار تنفيذ الثغرة الحقيقي -->
    <iframe id="exploit-frame"></iframe>

    <div class="cache-status" id="cacheStatus">Offline Cache: Checking status...</div>

    <script>
        let safetyTimeout;

        function showErrorScreen() {
            clearTimeout(safetyTimeout);
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('exploit-frame').style.display = 'none';
            document.getElementById('error-screen').style.display = 'flex';
        }

        function startExploitProcess() {
            const loadingScreen = document.getElementById('loading-screen');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            const exploitFrame = document.getElementById('exploit-frame');

            loadingScreen.style.display = 'flex';
            statusText.innerText = "INITIALIZING WEBKIT EXPLOIT...";
            progressFill.style.width = "25%";

            // مسار ملف الثغرة الفعلي الذي قمت بإضافته بجانب هذا الملف
            const targetExploitUrl = "./run_lapse.html";

            // مؤقت أمان زمني صارم (15 ثانية) كحد أقصى للتعليق
            safetyTimeout = setTimeout(() => {
                showErrorScreen();
            }, 15000);

            // الانتقال لمرحلة جلب وتثبيت البايود
            setTimeout(() => {
                statusText.innerText = "BUFFERING PAYLOAD DATA...";
                progressFill.style.width = "60%";
                
                // تحميل ملف الثغرة الحقيقي داخل الـ Iframe لتنفيذه على النظام
                exploitFrame.src = targetExploitUrl;
            }, 800);

            // تتبع نجاح تحميل ملف الثغرة
            exploitFrame.onload = function() {
                clearTimeout(safetyTimeout);
                progressFill.style.width = "100%";
                statusText.innerText = "EXECUTING GOLDHEN PAYLOAD...";

                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    exploitFrame.style.display = 'block';
                }, 1000);
            };

            // تتبع في حال فشل تحميل الملف
            exploitFrame.onerror = function() {
                showErrorScreen();
            };
        }

        // تفعيل التخزين المؤقت (Offline Cache) ليعمل الموقع بدون إنترنت على متصفح البلايستيشن
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => {
                    e.waitUntil(
                        caches.open('ps4-goldhen-cache-v1').then(cache => {
                            return cache.addAll(['./', location.href, './run_lapse.html']);
                        })
                    );
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(response => {
                            return response || fetch(e.request);
                        })
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl)
                .then(() => {
                    document.getElementById('cacheStatus').innerText = "Offline Cache: Ready & Cached Successfully ✅";
                })
                .catch(() => {
                    document.getElementById('cacheStatus').innerText = "Offline Cache: Unavailable ❌";
                });
        }
    </script>
</body>
</html>
